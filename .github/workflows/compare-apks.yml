name: Compare APKs (Signature, Manifest & Smali)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.apk"
      - ".github/workflows/compare-apks.yml"

jobs:
  compare-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Apktool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/apktool" https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          curl -fsSL -o "$HOME/.local/bin/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          chmod +x "$HOME/.local/bin/apktool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify APK files exist
        run: |
          ls -lh LocatrGo1.apk LocateGO2.apk

      - name: Compare Signatures & Badging (Package / Version)
        run: |
          mkdir -p report
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"

          {
            echo "=== LocatrGo1.apk: aapt2 badging ==="
            "$AAPT2" dump badging LocatrGo1.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label)" || true
            echo ""
            echo "=== LocateGO2.apk: aapt2 badging ==="
            "$AAPT2" dump badging LocateGO2.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label)" || true
            echo ""
            echo "=== LocatrGo1.apk: apksigner verify ==="
            "$APKSIGNER" verify --verbose --print-certs LocatrGo1.apk || true
            echo ""
            echo "=== LocateGO2.apk: apksigner verify ==="
            "$APKSIGNER" verify --verbose --print-certs LocateGO2.apk || true
          } > report/signature_and_badging.txt

          cat report/signature_and_badging.txt

      - name: Decompile both APKs with Apktool
        run: |
          mkdir -p out
          apktool d -f LocatrGo1.apk -o out/apk1
          apktool d -f LocateGO2.apk -o out/apk2

      - name: Compare Manifest, File Tree & Smali Code
        run: |
          diff -u out/apk1/AndroidManifest.xml out/apk2/AndroidManifest.xml > report/manifest_diff.txt || true
          diff -u out/apk1/apktool.yml out/apk2/apktool.yml > report/apktool_yml_diff.txt || true
          diff -rq out/apk1 out/apk2 > report/file_tree_diff.txt || true

          # Compare all smali directories
          mkdir -p out/smali1 out/smali2
          cp -r out/apk1/smali* out/smali1/ 2>/dev/null || true
          cp -r out/apk2/smali* out/smali2/ 2>/dev/null || true
          diff -ru out/smali1 out/smali2 > report/smali_diff.txt || true

      - name: Publish Comparison Summary
        run: |
          {
            echo "## APK Comparison Report: LocatrGo1.apk vs LocateGO2.apk"
            echo ""
            echo "### 1. Package & Signature Info"
            echo '```text'
            cat report/signature_and_badging.txt
            echo '```'
            echo ""
            echo "### 2. AndroidManifest.xml Diff (first 120 lines)"
            echo '```diff'
            head -n 120 report/manifest_diff.txt
            echo '```'
            echo ""
            echo "### 3. Changed Files Summary (first 100 lines)"
            echo '```text'
            head -n 100 report/file_tree_diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Full Diff Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-comparison-report
          path: report/
          retention-days: 14
