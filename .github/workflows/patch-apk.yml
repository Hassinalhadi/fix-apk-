name: Build LocateGO2 APK with Floating HTTP Log Capture

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'LocateGO2.apk'
      - '.github/workflows/patch-apk.yml'

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Latest Apktool
        run: |
          APKTOOL_VER=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Downloading apktool v${APKTOOL_VER}..."
          curl -sSL -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar"

      - name: Decode LocateGO2.apk
        run: |
          java -jar apktool.jar d LocateGO2.apk -o decoded -f

      - name: Compile Floating HTTP Log Interceptor to DEX
        run: |
          ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using android.jar: $ANDROID_JAR"
          echo "Using build-tools: $BUILD_TOOLS"

          mkdir -p log_src/okhttp3 log_src/okio log_src/com/locatego/log log_classes log_dex

          # Exact compile-time stubs matching LocateGO2's OkHttp3 & Okio signatures
          cat <<'EOF' > log_src/okio/BufferedSink.java
          package okio;
          public interface BufferedSink {}
          EOF

          cat <<'EOF' > log_src/okio/Buffer.java
          package okio;
          public class Buffer implements BufferedSink {
              public Buffer() {}
              public long size() { return 0; }
              public String readUtf8() { return ""; }
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/HttpUrl.java
          package okhttp3;
          public class HttpUrl {
              public String toString() { return ""; }
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/Headers.java
          package okhttp3;
          public class Headers {
              public String toString() { return ""; }
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/RequestBody.java
          package okhttp3;
          import java.io.IOException;
          import okio.BufferedSink;
          public abstract class RequestBody {
              public void writeTo(BufferedSink sink) throws IOException {}
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/Request.java
          package okhttp3;
          public class Request {
              public String method() { return ""; }
              public HttpUrl url() { return null; }
              public Headers headers() { return null; }
              public RequestBody body() { return null; }
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/ResponseBody.java
          package okhttp3;
          import java.io.IOException;
          public abstract class ResponseBody {
              public String string() throws IOException { return ""; }
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/Response.java
          package okhttp3;
          import java.io.IOException;
          public class Response {
              public int code() { return 0; }
              public String message() { return ""; }
              public Request request() { return null; }
              public Headers headers() { return null; }
              public ResponseBody peekBody(long byteCount) throws IOException { return null; }
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/Interceptor.java
          package okhttp3;
          import java.io.IOException;
          public interface Interceptor {
              Response intercept(Chain chain) throws IOException;
              interface Chain {
                  Request request();
                  Response proceed(Request request) throws IOException;
              }
          }
          EOF

          cat <<'EOF' > log_src/okhttp3/OkHttpClient.java
          package okhttp3;
          import java.util.List;
          public class OkHttpClient {
              public static class Builder {
                  public List<Interceptor> interceptors() { return null; }
                  public Builder addInterceptor(Interceptor interceptor) { return this; }
              }
          }
          EOF

          # Floating Button + In-App Log Viewer Overlay (no SYSTEM_ALERT_WINDOW permission needed)
          cat <<'EOF' > log_src/com/locatego/log/FloatingLogOverlay.java
          package com.locatego.log;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Application;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.lang.ref.WeakReference;
          import java.util.ArrayList;
          import java.util.List;

          public class FloatingLogOverlay implements Application.ActivityLifecycleCallbacks {
              private static final String TAG_BTN = "locatego_floating_log_btn";
              private static final int MAX_ENTRIES = 120;
              private static volatile boolean initialized = false;
              private static final List<String> entries = new ArrayList<>();
              private static volatile int errorCount = 0;
              private static final Handler mainHandler = new Handler(Looper.getMainLooper());
              private static WeakReference<Activity> currentActivityRef = new WeakReference<>(null);
              private static float lastX = -1f;
              private static float lastY = -1f;

              public static synchronized void ensureInitialized() {
                  if (initialized) return;
                  try {
                      Class<?> atClass = Class.forName("android.app.ActivityThread");
                      Application app = (Application) atClass.getMethod("currentApplication").invoke(null);
                      if (app != null) {
                          app.registerActivityLifecycleCallbacks(new FloatingLogOverlay());
                          initialized = true;
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public static synchronized void addEntry(String entry, boolean isError) {
                  if (entries.size() >= MAX_ENTRIES) {
                      entries.remove(0);
                  }
                  entries.add(entry);
                  if (isError) {
                      errorCount++;
                  }
                  mainHandler.post(FloatingLogOverlay::refreshBadge);
              }

              public static synchronized String getAllLogs() {
                  StringBuilder sb = new StringBuilder();
                  for (int i = entries.size() - 1; i >= 0; i--) {
                      sb.append(entries.get(i)).append("\n");
                  }
                  return sb.length() == 0 ? "لا توجد سجلات HTTP بعد." : sb.toString();
              }

              public static synchronized void clearLogs() {
                  entries.clear();
                  errorCount = 0;
                  mainHandler.post(FloatingLogOverlay::refreshBadge);
              }

              private static int dp(Context ctx, int val) {
                  return Math.round(val * ctx.getResources().getDisplayMetrics().density);
              }

              private static void refreshBadge() {
                  Activity act = currentActivityRef.get();
                  if (act == null || act.isFinishing()) return;
                  View root = act.getWindow() != null ? act.getWindow().getDecorView() : null;
                  if (!(root instanceof ViewGroup)) return;
                  View v = root.findViewWithTag(TAG_BTN);
                  if (v instanceof TextView) {
                      TextView tv = (TextView) v;
                      int total;
                      int errs;
                      synchronized (FloatingLogOverlay.class) {
                          total = entries.size();
                          errs = errorCount;
                      }
                      tv.setText(errs > 0 ? ("LOG " + errs + "!") : ("LOG " + total));
                      GradientDrawable bg = new GradientDrawable();
                      bg.setShape(GradientDrawable.RECTANGLE);
                      bg.setCornerRadius(dp(act, 22));
                      bg.setColor(errs > 0 ? Color.parseColor("#D32F2F") : Color.parseColor("#1E293B"));
                      bg.setStroke(dp(act, 1), Color.parseColor("#94A3B8"));
                      tv.setBackground(bg);
                  }
              }

              private static void attachToActivity(Activity act) {
                  if (act == null || act.isFinishing()) return;
                  View decor = act.getWindow() != null ? act.getWindow().getDecorView() : null;
                  if (!(decor instanceof FrameLayout)) return;
                  FrameLayout root = (FrameLayout) decor;
                  if (root.findViewWithTag(TAG_BTN) != null) {
                      refreshBadge();
                      return;
                  }

                  TextView btn = new TextView(act);
                  btn.setTag(TAG_BTN);
                  btn.setTextColor(Color.WHITE);
                  btn.setTextSize(11f);
                  btn.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  btn.setGravity(Gravity.CENTER);
                  int padH = dp(act, 10);
                  int padV = dp(act, 8);
                  btn.setPadding(padH, padV, padH, padV);
                  btn.setElevation(dp(act, 10));

                  DisplayMetrics dm = act.getResources().getDisplayMetrics();
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  lp.gravity = Gravity.TOP | Gravity.START;
                  btn.setLayoutParams(lp);
                  if (lastX < 0 || lastY < 0) {
                      lastX = dm.widthPixels - dp(act, 86);
                      lastY = dm.heightPixels * 0.28f;
                  }
                  btn.setX(lastX);
                  btn.setY(lastY);

                  btn.setOnTouchListener(new View.OnTouchListener() {
                      private float downRawX, downRawY, startX, startY;
                      private boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  downRawX = event.getRawX();
                                  downRawY = event.getRawY();
                                  startX = v.getX();
                                  startY = v.getY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  float dx = event.getRawX() - downRawX;
                                  float dy = event.getRawY() - downRawY;
                                  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                                      moved = true;
                                  }
                                  lastX = Math.max(0, Math.min(dm.widthPixels - v.getWidth(), startX + dx));
                                  lastY = Math.max(dp(act, 24), Math.min(dm.heightPixels - v.getHeight() - dp(act, 24), startY + dy));
                                  v.setX(lastX);
                                  v.setY(lastY);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) {
                                      showLogDialog(act);
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  root.addView(btn);
                  refreshBadge();
              }

              private static void showLogDialog(Activity act) {
                  try {
                      LinearLayout container = new LinearLayout(act);
                      container.setOrientation(LinearLayout.VERTICAL);
                      container.setPadding(dp(act, 12), dp(act, 12), dp(act, 12), dp(act, 8));
                      container.setBackgroundColor(Color.parseColor("#0F172A"));

                      ScrollView scroll = new ScrollView(act);
                      LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              Math.round(act.getResources().getDisplayMetrics().heightPixels * 0.55f)
                      );
                      scroll.setLayoutParams(slp);

                      TextView logView = new TextView(act);
                      logView.setText(getAllLogs());
                      logView.setTextColor(Color.parseColor("#E2E8F0"));
                      logView.setTextSize(11f);
                      logView.setTypeface(Typeface.MONOSPACE);
                      logView.setTextIsSelectable(true);
                      scroll.addView(logView);
                      container.addView(scroll);

                      LinearLayout actions = new LinearLayout(act);
                      actions.setOrientation(LinearLayout.HORIZONTAL);
                      actions.setGravity(Gravity.END);
                      actions.setPadding(0, dp(act, 8), 0, 0);

                      AlertDialog dialog = new AlertDialog.Builder(act)
                              .setTitle("LocateGO HTTP Log")
                              .setView(container)
                              .create();

                      Button copyBtn = new Button(act);
                      copyBtn.setText("نسخ");
                      copyBtn.setOnClickListener(v -> {
                          ClipboardManager cm = (ClipboardManager) act.getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              cm.setPrimaryClip(ClipData.newPlainText("LocateGO_HTTP_Log", getAllLogs()));
                              Toast.makeText(act, "تم نسخ السجل", Toast.LENGTH_SHORT).show();
                          }
                      });

                      Button clearBtn = new Button(act);
                      clearBtn.setText("مسح");
                      clearBtn.setOnClickListener(v -> {
                          clearLogs();
                          HttpLogInterceptor.clearFileLog();
                          logView.setText(getAllLogs());
                      });

                      Button closeBtn = new Button(act);
                      closeBtn.setText("إغلاق");
                      closeBtn.setOnClickListener(v -> dialog.dismiss());

                      actions.addView(copyBtn);
                      actions.addView(clearBtn);
                      actions.addView(closeBtn);
                      container.addView(actions);
                      dialog.show();
                  } catch (Throwable ignored) {
                  }
              }

              @Override public void onActivityCreated(Activity activity, Bundle savedInstanceState) {}
              @Override public void onActivityStarted(Activity activity) {}
              @Override public void onActivityResumed(Activity activity) {
                  currentActivityRef = new WeakReference<>(activity);
                  mainHandler.post(() -> attachToActivity(activity));
              }
              @Override public void onActivityPaused(Activity activity) {}
              @Override public void onActivityStopped(Activity activity) {}
              @Override public void onActivitySaveInstanceState(Activity activity, Bundle outState) {}
              @Override public void onActivityDestroyed(Activity activity) {}
          }
          EOF

          # Real HttpLogInterceptor (captures both OkHttp3 & AutoBid HttpURLConnection)
          cat <<'EOF' > log_src/com/locatego/log/HttpLogInterceptor.java
          package com.locatego.log;

          import android.app.Application;
          import android.util.Log;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.lang.reflect.Field;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import okhttp3.Interceptor;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;
          import okhttp3.ResponseBody;
          import okio.Buffer;

          public class HttpLogInterceptor implements Interceptor {
              private static final String TAG = "LocateGoLog";

              public static void attach(OkHttpClient.Builder builder) {
                  FloatingLogOverlay.ensureInitialized();
                  try {
                      if (builder == null) return;
                      for (Interceptor i : builder.interceptors()) {
                          if (i instanceof HttpLogInterceptor) return;
                      }
                      builder.addInterceptor(new HttpLogInterceptor());
                  } catch (Throwable ignored) {
                  }
              }

              public static void logAutoBidRequest(String method, String path, LinkedHashMap headers, String body) {
                  FloatingLogOverlay.ensureInitialized();
                  try {
                      StringBuilder sb = new StringBuilder();
                      String ts = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(new Date());
                      sb.append("\n[AutoBid REQ ").append(ts).append("] ").append(method).append(" ").append(path).append("\n");
                      if (headers != null && !headers.isEmpty()) {
                          sb.append("HEADERS: ");
                          for (Object k : headers.keySet()) {
                              sb.append(k).append("=").append(headers.get(k)).append("; ");
                          }
                          sb.append("\n");
                      }
                      if (body != null && !body.isEmpty()) {
                          sb.append("REQ BODY: ").append(body).append("\n");
                      }
                      writeLog(sb.toString(), false);
                  } catch (Throwable ignored) {
                  }
              }

              public static void logAutoBidResponse(String method, String path, Object respObj) {
                  FloatingLogOverlay.ensureInitialized();
                  try {
                      int code = -1;
                      String body = "";
                      if (respObj != null) {
                          for (Field f : respObj.getClass().getDeclaredFields()) {
                              f.setAccessible(true);
                              if (f.getType() == int.class) {
                                  code = f.getInt(respObj);
                              } else if (f.getType() == String.class) {
                                  Object val = f.get(respObj);
                                  if (val != null) body = val.toString();
                              }
                          }
                      }
                      boolean isErr = code >= 400 || code < 0;
                      String ts = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(new Date());
                      StringBuilder sb = new StringBuilder();
                      if (isErr) sb.append("!!! HTTP ERROR ").append(code).append(" !!!\n");
                      sb.append("[AutoBid RESP ").append(ts).append("] ").append(code).append(" | ").append(method).append(" ").append(path).append("\n");
                      sb.append("RESP BODY: ").append(body).append("\n");
                      sb.append("--------------------------------------------------------------\n");
                      writeLog(sb.toString(), isErr);
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              public Response intercept(Chain chain) throws IOException {
                  FloatingLogOverlay.ensureInitialized();
                  Request req = chain.request();
                  StringBuilder sb = new StringBuilder();
                  String ts = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(new Date());
                  sb.append("\n[OkHttp ").append(ts).append("] ").append(req.method()).append(" ").append(String.valueOf(req.url())).append("\n");

                  try {
                      if (req.headers() != null) {
                          sb.append("REQ HEADERS:\n").append(req.headers().toString());
                      }
                      RequestBody reqBody = req.body();
                      if (reqBody != null) {
                          try {
                              Buffer buf = new Buffer();
                              reqBody.writeTo(buf);
                              String bodyStr = buf.readUtf8();
                              if (bodyStr.length() > 4096) {
                                  bodyStr = bodyStr.substring(0, 4096) + "...[TRUNCATED]";
                              }
                              sb.append("REQ BODY:\n").append(bodyStr).append("\n");
                          } catch (Throwable t) {
                              sb.append("REQ BODY: [unreadable: ").append(t.getMessage()).append("]\n");
                          }
                      }
                  } catch (Throwable ignored) {
                  }

                  Response resp;
                  try {
                      resp = chain.proceed(req);
                  } catch (IOException e) {
                      sb.append("NETWORK ERROR: ").append(e.toString()).append("\n");
                      writeLog(sb.toString(), true);
                      throw e;
                  }

                  boolean isErr = false;
                  try {
                      int code = resp.code();
                      isErr = code >= 400;
                      if (isErr) {
                          sb.append("!!! HTTP ERROR ").append(code).append(" !!!\n");
                      }
                      sb.append("<<< ").append(code).append(" ").append(resp.message())
                        .append(" | ").append(String.valueOf(resp.request().url())).append("\n");
                      if (resp.headers() != null) {
                          sb.append("RESP HEADERS:\n").append(resp.headers().toString());
                      }
                      try {
                          ResponseBody peek = resp.peekBody(65536L);
                          if (peek != null) {
                              sb.append("RESP BODY:\n").append(peek.string()).append("\n");
                          }
                      } catch (Throwable t) {
                          sb.append("RESP BODY: [unreadable: ").append(t.getMessage()).append("]\n");
                      }
                  } catch (Throwable ignored) {
                  }

                  sb.append("--------------------------------------------------------------\n");
                  writeLog(sb.toString(), isErr);
                  return resp;
              }

              public static synchronized void clearFileLog() {
                  try {
                      Class<?> atClass = Class.forName("android.app.ActivityThread");
                      Application app = (Application) atClass.getMethod("currentApplication").invoke(null);
                      if (app != null) {
                          File dir = app.getExternalFilesDir(null);
                          if (dir != null) {
                              File logFile = new File(dir, "http_log.txt");
                              if (logFile.exists()) {
                                  new FileWriter(logFile, false).close();
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private static synchronized void writeLog(String text, boolean isError) {
                  FloatingLogOverlay.addEntry(text, isError);
                  try {
                      int len = text.length();
                      for (int i = 0; i < len; i += 3500) {
                          Log.e(TAG, text.substring(i, Math.min(len, i + 3500)));
                      }
                  } catch (Throwable ignored) {
                  }

                  try {
                      Class<?> atClass = Class.forName("android.app.ActivityThread");
                      Application app = (Application) atClass.getMethod("currentApplication").invoke(null);
                      if (app != null) {
                          File dir = app.getExternalFilesDir(null);
                          if (dir != null) {
                              if (!dir.exists()) dir.mkdirs();
                              File logFile = new File(dir, "http_log.txt");
                              FileWriter fw = new FileWriter(logFile, true);
                              fw.write(text);
                              fw.flush();
                              fw.close();
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
          EOF

          javac -source 1.8 -target 1.8 -cp "$ANDROID_JAR" -d log_classes \
            log_src/okio/*.java log_src/okhttp3/*.java log_src/com/locatego/log/*.java

          "$BUILD_TOOLS/d8" --classpath "$ANDROID_JAR" --classpath log_classes \
            --output log_dex log_classes/com/locatego/log/*.class

      - name: Hook OkHttpClient, AutoBid HTTP, Patch Accept 403, and Network Config
        run: |
          python3 - <<'EOF'
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET

          # 1. Hook okhttp3/OkHttpClient$Builder.build()
          builder_files = glob.glob("decoded/smali*/okhttp3/OkHttpClient$Builder.smali")
          assert len(builder_files) >= 1, f"OkHttpClient$Builder.smali not found! Found: {builder_files}"

          for path in builder_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              pattern = re.compile(
                  r'(\.method\s+(?:public\s+)?(?:final\s+)?build\(\)Lokhttp3/OkHttpClient;\s*\n'
                  r'(?:\s*\.(?:locals|registers)\s+\d+\s*\n))',
                  re.MULTILINE
              )
              hook = "    invoke-static {p0}, Lcom/locatego/log/HttpLogInterceptor;->attach(Lokhttp3/OkHttpClient$Builder;)V\n\n"
              new_content, count = pattern.subn(r'\1' + hook, content, count=1)
              assert count == 1, f"Failed to hook build() in {path}"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print(f"Hooked OkHttpClient$Builder.build() in {path}")

          # 2. Hook AutoBid HTTP client (La/z;->i), switch accept path to v3, and add User-Agent
          z_files = glob.glob("decoded/smali*/a/z.smali")
          for zpath in z_files:
              with open(zpath, "r", encoding="utf-8") as f:
                  zcontent = f.read()

              # Switch /api/v2/orders/assign/ -> /api/v3/orders/assign/
              if '"/api/v2/orders/assign/"' in zcontent:
                  zcontent = zcontent.replace('"/api/v2/orders/assign/"', '"/api/v3/orders/assign/"')
                  print(f"Updated accept endpoint to /api/v3/orders/assign/ in {zpath}")

              # Add User-Agent header in La/z;->i
              ua_target = '    const-string v0, "x-from-language"'
              if ua_target in zcontent:
                  ua_patch = (
                      '    const-string v0, "User-Agent"\n'
                      '    const-string v1, "okhttp/4.12.0"\n'
                      '    invoke-virtual {v8, v0, v1}, Ljava/net/URLConnection;->setRequestProperty(Ljava/lang/String;Ljava/lang/String;)V\n\n'
                      + ua_target
                  )
                  zcontent = zcontent.replace(ua_target, ua_patch, 1)
                  print(f"Added User-Agent header in {zpath}")

              m_pat = re.compile(
                  r'(\.method\s+[^\n]*\bi\(Ljava/lang/String;Ljava/lang/String;Ljava/util/LinkedHashMap;Ljava/lang/String;\)La/y;\s*\n'
                  r'\s*\.(?:locals|registers)\s+\d+\s*\n)(.*?)(\n\.end method)',
                  re.DOTALL
              )
              m = m_pat.search(zcontent)
              if m:
                  header, body, footer = m.group(1), m.group(2), m.group(3)
                  req_hook = "    invoke-static {p1, p2, p3, p4}, Lcom/locatego/log/HttpLogInterceptor;->logAutoBidRequest(Ljava/lang/String;Ljava/lang/String;Ljava/util/LinkedHashMap;Ljava/lang/String;)V\n"
                  body = re.sub(
                      r'(\n\s*return-object\s+(v\d+|p\d+))',
                      r'\n    invoke-static {p1, p2, \2}, Lcom/locatego/log/HttpLogInterceptor;->logAutoBidResponse(Ljava/lang/String;Ljava/lang/String;Ljava/lang/Object;)V\1',
                      body
                  )
                  zcontent = zcontent[:m.start()] + header + req_hook + body + footer + zcontent[m.end():]
                  print(f"Hooked AutoBid HTTP in {zpath}")

              with open(zpath, "w", encoding="utf-8") as f:
                  f.write(zcontent)

          # 3. Allow HTTP 403 (0x193) in AutoBidService to retry instead of permanently blocking the order
          abs_files = glob.glob("decoded/smali*/sa/lg/android/locate/autobid/AutoBidService.smali")
          for spath in abs_files:
              with open(spath, "r", encoding="utf-8") as f:
                  scontent = f.read()
              retry_pat = re.compile(
                  r'(const/16\s+(v\d+),\s+0x198\s*\n'
                  r'(?:\s*const/16\s+v\d+,\s+0x1f4\s*\n)?'
                  r'\s*if-eq\s+(v\d+),\s+\2,\s+(:cond_\w+))'
              )
              scontent, n = retry_pat.subn(
                  r'\1\n\n    const/16 \2, 0x193\n    if-eq \3, \2, \4',
                  scontent,
                  count=1
              )
              if n > 0:
                  with open(spath, "w", encoding="utf-8") as f:
                      f.write(scontent)
                  print(f"Patched HTTP 403 retry handling in {spath}")

          # 4. Add network_security_config.xml to trust user CA certs (for Reqable / HTTP Toolkit)
          os.makedirs("decoded/res/xml", exist_ok=True)
          nsc_path = "decoded/res/xml/network_security_config.xml"
          with open(nsc_path, "w", encoding="utf-8") as f:
              f.write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<network-security-config>\n'
                  '    <base-config cleartextTrafficPermitted="true">\n'
                  '        <trust-anchors>\n'
                  '            <certificates src="system" />\n'
                  '            <certificates src="user" />\n'
                  '        </trust-anchors>\n'
                  '    </base-config>\n'
                  '</network-security-config>\n'
              )
          print(f"Created {nsc_path}")

          # 5. Update AndroidManifest.xml (do NOT force debuggable=true to avoid Play Integrity debug flag)
          manifest_path = "decoded/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app = root.find("application")
          assert app is not None, "<application> tag not found in AndroidManifest.xml"

          ANDROID_NS = "{http://schemas.android.com/apk/res/android}"
          app.attrib.pop(f"{ANDROID_NS}debuggable", None)
          app.set(f"{ANDROID_NS}networkSecurityConfig", "@xml/network_security_config")
          app.set(f"{ANDROID_NS}usesCleartextTraffic", "true")
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          print("Updated AndroidManifest.xml (without debuggable=true)")
          EOF

      - name: Rebuild, Inject Log DEX, Zipalign and Sign APK
        run: |
          java -jar apktool.jar b decoded -o LocateGO2-unaligned.apk

          python3 - <<'EOF'
          import re, zipfile

          with zipfile.ZipFile("LocateGO2-unaligned.apk", "a") as z:
              dex_nums = [1]
              for n in z.namelist():
                  m = re.match(r'^classes(\d*)\.dex$', n)
                  if m:
                      dex_nums.append(int(m.group(1) or 1))
              next_dex = f"classes{max(dex_nums) + 1}.dex"
              z.write("log_dex/classes.dex", next_dex)
              print(f"Injected Floating Log DEX as {next_dex}")
          EOF

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -p -f 4 LocateGO2-unaligned.apk LocateGO2-log.apk

          keytool -genkeypair -v \
            -keystore release-temp.jks \
            -alias locatego \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=LocateGoLog, OU=Dev, O=LocateGo, L=Baghdad, S=Baghdad, C=IQ"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release-temp.jks \
            --ks-key-alias locatego \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            LocateGO2-log.apk

          "$BUILD_TOOLS/apksigner" verify --verbose LocateGO2-log.apk

      - name: Upload LocateGO2-log APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocateGO2-log
          path: LocateGO2-log.apk
          retention-days: 30
