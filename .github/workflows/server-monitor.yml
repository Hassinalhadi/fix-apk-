name: Monitor and Auto-Reload PythonAnywhere Server

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *'

jobs:
  health-and-reload:
    runs-on: ubuntu-latest
    steps:
      - name: Check Server Health
        id: health
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://ammaralhadi.pythonanywhere.com/health")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi

      - name: Reload PythonAnywhere Web App if Down or on Push
        if: steps.health.outcome == 'failure' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          curl -f -X POST \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
            "https://www.pythonanywhere.com/api/v0/user/ammaralhadi/webapps/ammaralhadi.pythonanywhere.com/reload/"

      - name: Re-verify Health After Reload
        if: steps.health.outcome == 'failure' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          sleep 5
          curl -f --max-time 15 "https://ammaralhadi.pythonanywhere.com/health"
